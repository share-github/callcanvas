<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
</head>
<body>
    <!--
        管理画面スコープ: utils.js + service.js + admin.js
        ※ app.js は含まない（init/setupUI は使わない）

        service.js はこのHTMLとindex.htmlの両方から参照される。
        service.js でコマンド実行すると QuickPick が表示され、
        どちらのHTMLスコープで解析するか選択できる。
    -->
    <script src="utils.js"></script>
    <script src="service.js"></script>
    <script src="admin.js"></script>
</body>
</html>
